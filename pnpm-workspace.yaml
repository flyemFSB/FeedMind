packages:
  - "apps/*"
  - "packages/*"

catalog:
  typescript: ^7.0.2
  zod: ^4.5.2
  drizzle-orm: ^0.45.2
  ai: ^7.0.84
  vitest: ^4.1.11
  "@vitest/coverage-v8": ^4.1.11
  "@playwright/test": ^1.62.0
  oxlint: ^1.80.0
  oxlint-tsgolint: ^7.0.2001
  prettier: ^3.9.6
  "@types/node": ^26.4.0
  "@t3-oss/env-core": ^0.13.11
  cheerio: ^1.2.0
  pino: ^10.3.1
  hono: ^4.13.5
  feedsmith: ^2.9.6
  motion: ^13.1.1

overrides:
  "@electron/get": "^5.1.0"

# pnpm v11/v12: onlyBuiltDependencies → allowBuilds
allowBuilds:
  esbuild: true
  agent-browser: true
  edgedriver: true
  geckodriver: true
  tesseract.js: true
  protobufjs: true
  msedge-tts: true
  electron: true
  electron-winstaller: true

hoist: false
# drizzle-kit 从自身位置解析驱动与 ORM（二者均未声明为它的 dependencies），需 hoist 到根 node_modules
publicHoistPattern:
  - "@libsql/client"
  - "drizzle-orm"
linkWorkspacePackages: true
# pnpm 12 默认启用 minimumReleaseAge=1440min（24 小时供应链门禁，新版发布不满 1 天不可安装）。
# 此清单是被门禁拦截版本的放行名单（失败时 pnpm 会自动追加）；删除它会让含新版本的 lockfile 校验失败
minimumReleaseAgeExclude:
  - "@ai-sdk/gateway@4.0.68"
  - "@ai-sdk/mcp@2.0.40"
  - "@ai-sdk/openai-compatible@3.0.40"
  - "@ai-sdk/provider-utils@5.0.33"
  - "@ai-sdk/react@4.0.87"
  - "@mastra/core@1.63.2"
  - "@mastra/hono@1.7.5"
  - "@mastra/libsql@1.22.2"
  - "@mastra/memory@1.28.1"
  - "@mastra/server@1.63.2"
  - ai@7.0.84
  - lucide-react@1.37.0
  - zod@4.5.2
