packages:
  - "apps/*"
  - "packages/*"

catalog:
  typescript: ^7.0.2
  zod: ^4.4.3
  drizzle-orm: ^0.45.2
  ai: ^7.0.22
  vitest: ^4.1.11
  "@vitest/coverage-v8": ^4.1.11
  "@playwright/test": ^1.50.0
  oxlint: ^1.79.0
  oxlint-tsgolint: ^7.0.2001
  prettier: ^3.9.6
  "@types/node": ^26.2.0
  "@t3-oss/env-core": ^0.12.0
  cheerio: ^1.2.0
  pino: ^10.3.1
  hono: ^4.13.0
  feedsmith: ^2.9.6
  motion: ^13.1.1

overrides:
  "@electron/get": "^5.1.0"

# pnpm v11: onlyBuiltDependencies → allowBuilds
allowBuilds:
  esbuild: true
  agent-browser: true
  edgedriver: true
  geckodriver: true
  tesseract.js: true
  protobufjs: true
  msedge-tts: true
  electron: true
  electron-winstaller: true

hoist: false
# drizzle-kit 从自身位置解析驱动与 ORM（二者均未声明为它的 dependencies），需 hoist 到根 node_modules
publicHoistPattern:
  - "@libsql/client"
  - "drizzle-orm"
linkWorkspacePackages: true
minimumReleaseAgeExclude:
  - "@hono/node-server@2.0.5"
  - "@ai-sdk/gateway@4.0.7"
  - "@ai-sdk/react@4.0.10"
  - "@mastra/ai-sdk@1.6.1"
  - "@mastra/core@1.48.0"
  - "@mastra/hono@1.5.3"
  - "@mastra/libsql@1.14.3"
  - "@mastra/schema-compat@1.3.2"
  - "@mastra/server@1.48.0"
  - ai@7.0.9
  - shadcn@4.16.1
  - hono@4.13.0
