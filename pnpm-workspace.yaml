packages:
  - "apps/*"
  - "packages/*"

# pnpm v11: onlyBuiltDependencies → allowBuilds
allowBuilds:
  esbuild: true
  agent-browser: true
  edgedriver: true
  geckodriver: true
  tesseract.js: true
  sharp: true
  protobufjs: true

hoist: false
linkWorkspacePackages: true
minimumReleaseAgeExclude:
  - "@hono/node-server@2.0.5"
  - "@ai-sdk/gateway@4.0.7"
  - "@ai-sdk/react@4.0.10"
  - "@mastra/ai-sdk@1.6.1"
  - "@mastra/core@1.48.0"
  - "@mastra/hono@1.5.3"
  - "@mastra/libsql@1.14.3"
  - "@mastra/schema-compat@1.3.2"
  - "@mastra/server@1.48.0"
  - ai@7.0.9
