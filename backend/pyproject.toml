[project]
name = "feedmind-backend"
version = "0.1.0"
description = "FeedMind FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.124.0,<1.0.0",
    "loguru>=0.7,<1.0",
    "pydantic-settings>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "cryptography>=44.0.0,<45.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "pytest>=9.0,<10.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
