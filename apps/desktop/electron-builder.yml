appId: com.feedmind.desktop
productName: FeedMind
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: ../../release
files:
  - dist/**/*
  - package.json
  # API 生产服务所需全量产物（node_modules 由 builder 根据 dependencies 打包）
  - node_modules/@feedmind/api/dist/**/*
  - node_modules/@feedmind/contracts/dist/**/*
  - node_modules/@feedmind/db/dist/**/*
  - node_modules/@feedmind/env/dist/**/*
  - node_modules/@feedmind/shared/dist/**/*
  - node_modules/@feedmind/wiki-core/dist/**/*
  - node_modules/@feedmind/crawler-core/dist/**/*
extraResources:
  # Web 静态产物打入 resources/web-dist，API 在生产模式同源提供 SPA 托管
  - from: ../web/dist
    to: web-dist
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
