name: feedmind

x-app-env: &app-env
  TZ: Asia/Shanghai

x-health-startup: &health-startup
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 10s

services:
  frontend:
    container_name: feedmind-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_AEGRA_API_URL: ${NEXT_PUBLIC_AEGRA_API_URL:-http://localhost:2026}
        NEXT_PUBLIC_AEGRA_ASSISTANT_ID: ${NEXT_PUBLIC_AEGRA_ASSISTANT_ID:-feedmind}
        NEXT_PUBLIC_BACKEND_API_URL: ${NEXT_PUBLIC_BACKEND_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_FEEDMIND_MODEL: ${NEXT_PUBLIC_FEEDMIND_MODEL:-}
    environment:
      <<: *app-env
      NEXT_PUBLIC_AEGRA_API_URL: ${NEXT_PUBLIC_AEGRA_API_URL:-http://localhost:2026}
      NEXT_PUBLIC_AEGRA_ASSISTANT_ID: ${NEXT_PUBLIC_AEGRA_ASSISTANT_ID:-feedmind}
      NEXT_PUBLIC_BACKEND_API_URL: ${NEXT_PUBLIC_BACKEND_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_FEEDMIND_MODEL: ${NEXT_PUBLIC_FEEDMIND_MODEL:-}
    depends_on:
      backend:
        condition: service_started
      aegra-api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/chat').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      <<: *health-startup
      start_period: 30s

  backend:
    container_name: feedmind-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    env_file:
      - .env
    environment:
      <<: *app-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-feedmind}:${POSTGRES_PASSWORD:-feedmind}@postgres:5432/${POSTGRES_DB:-feedmind}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()\""]
      <<: *health-startup

  aegra-api:
    container_name: feedmind-aegra-api
    build:
      context: ./agent
      dockerfile: Dockerfile.aegra
      target: final
    env_file:
      - .env
    environment:
      <<: *app-env
      AEGRA_CONFIG: aegra.json
      AUTH_TYPE: ${AUTH_TYPE:-noop}
      PORT: 2026
      DATABASE_URL: postgresql://${POSTGRES_USER:-feedmind}:${POSTGRES_PASSWORD:-feedmind}@postgres:5432/${POSTGRES_DB:-feedmind}
      REDIS_BROKER_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      BACKEND_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:2026/health || exit 1"]
      <<: *health-startup
      start_period: 20s

  postgres:
    container_name: feedmind-postgres
    image: pgvector/pgvector:pg18
    environment:
      <<: *app-env
      POSTGRES_DB: ${POSTGRES_DB:-feedmind}
      POSTGRES_USER: ${POSTGRES_USER:-feedmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feedmind}
      PGDATA: /var/lib/postgresql/data
      PGTZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      <<: *health-startup

  redis:
    container_name: feedmind-redis
    image: redis:8-alpine
    environment:
      <<: *app-env
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *health-startup

volumes:
  postgres_data:
  redis_data: