name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# PR 反复提交时取消上一个还在跑的 job，避免排队浪费；
# push master 时 github.ref 恒为 refs/heads/master，若同样取消会掐断上一个 master CI，故仅 PR 生效
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      # pnpm/setup（pnpm/action-setup 的继任者）；pnpm 版本自动取自 packageManager 字段（v2 起直接下载 pnpm 12 原生二进制）
      - name: 安装 pnpm 与 Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      # CI 下 pnpm 自动启用 frozen-lockfile，锁文件与 package.json 不一致会失败
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 共享包是 TS 源码，测试与 typecheck 经 workspace 解析 dist 产物，必须先构建
      - name: 构建共享包
        run: pnpm build:packages

      - name: 类型检查
        run: pnpm typecheck

      - name: 代码检查
        run: pnpm lint

      # react-doctor 分数门禁：防诊断回退（当前稳态 88，阈值 85 留余量；
      # 剩置的 11 条为已决议暂不重构的 no-giant/no-multi 项）
      - name: React Doctor 分数门禁
        run: |
          SCORE=$(npx react-doctor . --project @feedmind/web -y --score 2>/dev/null | grep -oE '[0-9]+' | head -1)
          echo "react-doctor score: ${SCORE:-"?"}"
          if [ -z "$SCORE" ] || [ "$SCORE" -lt 85 ]; then
            echo "::error::react-doctor 分数低于 85（当前 ${SCORE:-无输出}），请先修复新引入的诊断"
            exit 1
          fi

      - name: 单元与 API 集成测试
        run: pnpm test

      - name: 安装 Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Web 端核心 E2E 测试
        run: pnpm test:e2e
